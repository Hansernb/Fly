<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>狗熊岭游乐园 · 森林小游戏</title>
<style>
  :root{
    --forest:#2f7d4f; --forest-deep:#1f5c39; --leaf:#4caf6d;
    --wood:#a9743c; --wood-light:#c89b63; --cream:#fff8ec;
    --honey:#ffb703; --text:#3a2e1f; --muted:#8a7a63; --danger:#e4572e;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Comic Sans MS",sans-serif;
    color:var(--text); min-height:100vh;
    background:linear-gradient(180deg,#2b4a35 0%,#24402e 55%,#1d3325 100%);
    -webkit-font-smoothing:antialiased;
    padding:22px 18px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  /* ---------- 首页入口卡片 ---------- */
  .sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .sec-title h2{font-size:20px;color:#fff;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.35)}
  .sec-count{font-size:12px;font-weight:700;color:#e8f3dd;background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 13px;white-space:nowrap}
  .entry{position:relative;display:flex;align-items:center;gap:22px;padding:24px 28px;
    border:2px solid var(--wood-light);border-radius:22px;overflow:hidden;
    background:
      radial-gradient(circle at 92% 12%,rgba(255,183,3,.34),transparent 46%),
      radial-gradient(circle at 6% 96%,rgba(76,175,109,.26),transparent 52%),
      linear-gradient(135deg,#eef9e2 0%,#f9f5dd 55%,#ffeec2 100%);
    box-shadow:0 14px 34px -22px rgba(0,0,0,.7);
    transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
  .entry::after{content:"";position:absolute;inset:8px;border:2px dashed rgba(200,155,99,.4);
    border-radius:16px;pointer-events:none}
  .entry:hover{transform:translateY(-4px);border-color:var(--forest);
    box-shadow:0 26px 46px -26px rgba(0,0,0,.8)}
  .ge-art{position:relative;flex:0 0 132px;height:100px}
  .ge-pad{width:132px;height:100px;filter:drop-shadow(0 10px 14px rgba(31,92,57,.22));
    transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .entry:hover .ge-pad{transform:rotate(-7deg) translateY(-5px) scale(1.04)}
  .spark{position:absolute;color:var(--honey);font-size:14px;font-weight:900;animation:tw 2.4s ease-in-out infinite}
  .spark.s1{top:2px;left:4px}.spark.s2{top:14px;right:2px;font-size:10px;animation-delay:.7s}
  .spark.s3{bottom:6px;right:12px;font-size:12px;animation-delay:1.4s}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .ge-text{flex:1;min-width:0}
  .ge-badge{display:inline-block;background:rgba(255,183,3,.24);color:#9a6c05;font-size:11px;
    font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:7px}
  .ge-text h3{font-size:20px;font-weight:900;color:var(--forest-deep);margin-bottom:7px;letter-spacing:.4px}
  .ge-text p{font-size:13px;line-height:1.7;color:var(--muted);max-width:560px;margin-bottom:11px}
  .ge-tags{display:flex;flex-wrap:wrap;gap:8px}
  .ge-tag{background:#fff;border:2px solid rgba(47,125,79,.16);border-radius:999px;padding:4px 11px;
    font-size:12px;font-weight:700;color:var(--forest-deep)}
  .ge-btn{position:relative;z-index:1;flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
    border:none;border-radius:999px;background:linear-gradient(180deg,#ffd23f,var(--honey));
    color:#5a3d00;font-size:15px;font-weight:900;padding:14px 26px;cursor:pointer;white-space:nowrap;
    box-shadow:0 6px 0 #e09b00,0 14px 24px -14px rgba(224,155,0,.9);
    transition:transform .08s ease,box-shadow .08s ease,filter .15s ease}
  .ge-btn:hover{filter:brightness(1.04)}
  .ge-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #e09b00}

  /* ---------- 小游戏中心 ---------- */
  .gp-nav{display:flex;align-items:center;gap:14px;background:rgba(255,251,240,.94);
    border:2px solid var(--wood-light);border-radius:999px;padding:10px 18px;margin-bottom:22px;
    box-shadow:0 10px 26px -14px rgba(31,92,57,.5)}
  .gp-back{border:2px solid var(--wood-light);background:#fffdf8;color:var(--forest-deep);
    font-size:13px;font-weight:800;padding:8px 16px;border-radius:999px;cursor:pointer;
    transition:all .16s ease;white-space:nowrap;font-family:inherit}
  .gp-back:hover{background:var(--forest);border-color:var(--forest);color:#fff;transform:translateX(-2px)}
  .gp-brand{font-size:16px;font-weight:900;color:var(--forest-deep);flex:1}
  .gp-record{font-size:12px;font-weight:700;color:var(--muted)}

  .lobby-hero{text-align:center;background:linear-gradient(160deg,#fdf6e3,#eef8e4 70%,#e3f2d5);
    border:2px dashed var(--wood-light);border-radius:24px;padding:30px 22px 26px;margin-bottom:22px;
    position:relative;overflow:hidden}
  .lobby-hero::before{content:"";position:absolute;inset:-40px -40px auto auto;width:180px;height:180px;
    background:radial-gradient(circle,rgba(255,183,3,.28),transparent 65%)}
  .lh-badge{display:inline-block;background:rgba(255,183,3,.2);color:#a9740a;font-size:12px;
    font-weight:800;padding:4px 14px;border-radius:999px;margin-bottom:10px}
  .lobby-hero h1{font-size:27px;color:var(--forest-deep);letter-spacing:1px;margin-bottom:8px}
  .lobby-hero p{font-size:14px;color:var(--muted);margin-bottom:16px}
  .lh-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .lh-chip{background:#fff;border:2px solid rgba(47,125,79,.16);border-radius:999px;padding:7px 14px;
    font-size:12px;font-weight:700;color:var(--forest-deep);box-shadow:0 4px 10px -6px rgba(47,125,79,.4)}

  .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
  .game-card{background:#fff;border:2px solid var(--wood-light);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 22px -12px rgba(47,125,79,.5);
    transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
  .game-card:hover{transform:translateY(-7px);border-color:var(--gc);box-shadow:0 24px 40px -20px var(--gc)}
  .gc-cover{position:relative;height:138px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.5),transparent 55%),
      linear-gradient(135deg,var(--gc),#2f7d4f);overflow:hidden}
  .gc-icon{font-size:62px;line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.22));
    transition:transform .3s ease;z-index:1}
  .game-card:hover .gc-icon{transform:scale(1.14) rotate(-8deg)}
  .gc-best{position:absolute;top:12px;right:12px;z-index:2;background:rgba(255,255,255,.92);
    color:var(--forest-deep);font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
  .gc-body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
  .gc-body h3{font-size:17px;font-weight:900;color:var(--text);margin-bottom:7px}
  .gc-body p{font-size:13px;line-height:1.6;color:var(--muted);flex:1;margin-bottom:14px}
  .gc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .gc-time{font-size:12px;font-weight:700;color:var(--muted)}
  .gc-play{border:none;background:var(--honey);color:#4a3208;font-size:13px;font-weight:900;
    padding:9px 18px;border-radius:999px;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 14px -6px rgba(255,183,3,.9);transition:all .16s ease}
  .gc-play:hover{background:#ffc733;transform:translateY(-2px)}
  .lobby-tip{margin-top:18px;text-align:center;font-size:12px;color:rgba(255,255,255,.78)}

  .stage{background:rgba(255,251,240,.97);border:2px solid var(--wood-light);border-radius:24px;
    padding:16px;box-shadow:0 18px 40px -22px rgba(31,92,57,.7);position:relative}
  .stage-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:4px 6px 14px;
    border-bottom:2px dashed rgba(200,155,99,.45);margin-bottom:14px}
  .stage-title{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}
  .stage-icon{font-size:30px}
  .stage-title b{display:block;font-size:16px;color:var(--forest-deep)}
  .stage-sub{font-size:11px;color:var(--muted);font-weight:700}
  .stage-hud{display:flex;gap:8px}
  .hud-item{background:rgba(47,125,79,.07);border:2px solid rgba(47,125,79,.14);border-radius:14px;
    padding:6px 14px;min-width:66px;text-align:center}
  .hud-item.best{background:rgba(255,183,3,.14);border-color:rgba(255,183,3,.4)}
  .hud-k{display:block;font-size:10px;font-weight:700;color:var(--muted)}
  .hud-v{display:block;font-size:18px;font-weight:900;color:var(--forest-deep);line-height:1.2}
  .hud-item.best .hud-v{color:#a9740a}
  .stage-ops{display:flex;gap:8px}
  .btn{border:none;font-weight:900;border-radius:999px;padding:11px 22px;font-size:14px;
    cursor:pointer;transition:all .16s ease;font-family:inherit}
  .btn.sm{padding:9px 16px;font-size:12px}
  .btn.primary{background:var(--honey);color:#4a3208;box-shadow:0 8px 18px -8px rgba(255,183,3,.95)}
  .btn.primary:hover{background:#ffc733;transform:translateY(-2px)}
  .btn.ghost{background:#fff;color:var(--forest-deep);border:2px solid var(--wood-light)}
  .btn.ghost:hover{border-color:var(--forest);color:var(--forest)}
  .stage-hint{margin-top:12px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}

  .honey-canvas{display:block;width:100%;height:380px;border-radius:18px;
    border:2px solid rgba(200,155,99,.5);cursor:crosshair;touch-action:none}

  .mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:560px;margin:6px auto 0}
  .mole-hole{position:relative;aspect-ratio:1/.86;border:2px solid var(--wood-light);border-radius:18px;
    cursor:pointer;overflow:hidden;background:linear-gradient(180deg,#eaf7d9,#d5ecbb);padding:0;
    transition:transform .12s ease,border-color .15s ease}
  .mole-hole:active{transform:scale(.97)}
  .hole-grass{position:absolute;left:0;right:0;top:0;height:42%;
    background:radial-gradient(circle at 50% 120%,rgba(76,175,109,.35),transparent 70%)}
  .hole-dirt{position:absolute;left:50%;bottom:12%;width:62%;height:26%;transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 30%,#6b4a25,#4a3218);border-radius:50%;
    box-shadow:inset 0 6px 10px rgba(0,0,0,.45)}
  .mole-emoji{position:absolute;left:50%;bottom:-18%;transform:translate(-50%,0) scale(.9);
    font-size:46px;line-height:1;opacity:0;z-index:2;
    transition:all .16s cubic-bezier(.34,1.56,.64,1)}
  .mole-hole.up .mole-emoji{opacity:1;bottom:8%;transform:translate(-50%,0) scale(1)}
  .mole-hole.up{border-color:var(--forest);background:linear-gradient(180deg,#f3fbe6,#d5ecbb)}
  .mole-hole.hit .mole-emoji{transform:translate(-50%,0) scale(1.2) rotate(-8deg)}

  .match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:620px;margin:6px auto 0}
  .mcard{perspective:700px;border:none;background:none;padding:0;aspect-ratio:1/1.06;cursor:pointer}
  .mcard-inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .42s cubic-bezier(.4,.1,.2,1)}
  .mcard.flip .mcard-inner{transform:rotateY(180deg)}
  .mcard-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    border-radius:16px;backface-visibility:hidden;font-size:34px;border:2px solid var(--wood-light)}
  .mcard-back{background:linear-gradient(150deg,#2f7d4f,#4caf6d);color:#eaf7d9;
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.22)}
  .mcard-front{background:#fffdf5;transform:rotateY(180deg)}
  .mcard.done .mcard-front{background:#eef9e2;border-color:var(--forest);
    box-shadow:0 0 0 3px rgba(76,175,109,.22)}
  .mcard.done{cursor:default}

  .result-mask{position:absolute;inset:0;background:rgba(31,92,57,.32);backdrop-filter:blur(3px);
    border-radius:24px;display:flex;align-items:center;justify-content:center;z-index:5}
  .result-card{background:#fffdf5;border:3px solid var(--honey);border-radius:24px;
    padding:26px 34px 24px;text-align:center;max-width:320px;
    box-shadow:0 24px 50px -18px rgba(0,0,0,.35);animation:popIn .24s ease}
  @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .result-emoji{font-size:46px;line-height:1}
  .result-card h3{font-size:17px;color:var(--forest-deep);margin:8px 0 4px}
  .result-score{font-size:32px;font-weight:900;color:var(--danger);margin-bottom:6px}
  .result-sub{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:18px}
  .result-btns{display:flex;gap:10px;justify-content:center}

  @media (max-width:780px){
    .entry{flex-direction:column;text-align:center;padding:22px 18px 24px;gap:14px}
    .ge-art{flex:0 0 auto;height:88px}
    .ge-pad{width:118px;height:88px}
    .ge-tags{justify-content:center}
    .ge-btn{width:100%;justify-content:center}
    .gp-record{display:none}
    .mole-emoji{font-size:34px}
    .mcard-face{font-size:26px}
    .honey-canvas{height:300px}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ================= 数据 ================= */
const GAMES = [
  { id:'honey', icon:'🍯', name:'接蜂蜜', color:'#ffb703', unit:'分', time:'30 秒',
    desc:'移动小熊篮子接住掉落的蜂蜜罐，小心别接到蜜蜂！' },
  { id:'mole', icon:'🐿️', name:'打松鼠', color:'#4caf6d', unit:'分', time:'30 秒',
    desc:'小松鼠从树洞里探头，快点它，看看谁反应最快。' },
  { id:'match', icon:'🃏', name:'森林翻牌', color:'#8a6fd1', unit:'步', time:'不限时',
    desc:'翻开卡片找出成对的森林伙伴，用最少步数全部配对。' }
];
const STORAGE_KEY = 'boonie_game_best_v1';
const BEST = (() => {
  try { const r = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    return { honey: r.honey || 0, mole: r.mole || 0, match: r.match || 0 }; }
  catch { return { honey:0, mole:0, match:0 }; }
})();
function saveBest(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(BEST)); }catch(e){} }

let screen = 'home';   // home | lobby | game
let active = '';
let game = null;       // 各游戏运行态

const app = document.getElementById('app');

/* ================= 首页入口卡片 ================= */
const PAD_SVG = `
<svg class="ge-pad" viewBox="0 0 148 104">
  <defs>
    <linearGradient id="padGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc47d"/><stop offset="1" stop-color="#2f7d4f"/>
    </linearGradient>
  </defs>
  <ellipse cx="74" cy="94" rx="48" ry="7" fill="rgba(31,92,57,.16)"/>
  <path d="M38 24h72c12 0 21 10 19 23l-5 27c-2 11-15 15-22 6l-9-12H57l-9 12c-7 9-20 5-22-6l-5-27c-2-13 5-23 17-23Z"
    fill="url(#padGrad)" stroke="#1f5c39" stroke-width="3" stroke-linejoin="round"/>
  <path d="M43 33h62c8 0 14 6 13 15l-4 23c-1 6-8 8-12 4l-8-10H54l-8 10c-4 4-11 2-12-4l-4-23c-1-9 5-15 13-15Z"
    fill="rgba(255,255,255,.14)"/>
  <rect x="35" y="48" width="9" height="26" rx="3" fill="#204d33"/>
  <rect x="26.5" y="56.5" width="26" height="9" rx="3" fill="#204d33"/>
  <circle cx="104" cy="51" r="7.5" fill="#ffb703" stroke="#e39400" stroke-width="2.5"/>
  <circle cx="118" cy="64" r="7.5" fill="#e4572e" stroke="#bf4120" stroke-width="2.5"/>
  <circle cx="90" cy="64" r="7.5" fill="#fff7e0" stroke="#c89b63" stroke-width="2.5"/>
  <path d="M74 26c0-9 6-16 14-17-1 9-6 15-14 17Z" fill="#4caf6d" stroke="#1f5c39" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="74" cy="26" r="3.2" fill="#ffb703" stroke="#1f5c39" stroke-width="2"/>
</svg>`;

function renderHome(){
  app.innerHTML = `
    <section>
      <div class="sec-title">
        <h2>🎮 森林小游戏</h2>
        <span class="sec-count">3 款小游戏 · 随时开局</span>
      </div>
      <div class="entry">
        <div class="ge-art">
          ${PAD_SVG}
          <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span>
        </div>
        <div class="ge-text">
          <span class="ge-badge">🎮 新玩法</span>
          <h3>森林小游戏中心</h3>
          <p>排队等项目的空档来一局吧——接住掉落的蜂蜜罐、拍醒探头的小松鼠、翻开森林伙伴的配对卡，最佳成绩会留在狗熊岭。</p>
          <div class="ge-tags">
            <span class="ge-tag">🍯 接蜂蜜</span>
            <span class="ge-tag">🐿️ 打松鼠</span>
            <span class="ge-tag">🃏 森林翻牌</span>
          </div>
        </div>
        <button class="ge-btn" onclick="enterLobby()"><span>🎮</span> 开始游戏 ›</button>
      </div>
    </section>`;
}

/* ================= 大厅 ================= */
function renderLobby(){
  app.innerHTML = `
    <header class="gp-nav">
      <button class="gp-back" onclick="goHome()">← 返回首页</button>
      <div class="gp-brand">🎮 森林小游戏中心</div>
      <div class="gp-record">最高分：${BEST.honey} / ${BEST.mole} / ${BEST.match} 步</div>
    </header>
    <section>
      <div class="lobby-hero">
        <span class="lh-badge">🍯 狗熊岭限定</span>
        <h1>森林小游戏中心</h1>
        <p>三款手绘小游戏，随手玩一局，看看你能拿多少分～</p>
        <div class="lh-chips">
          <span class="lh-chip">🎯 最佳 接蜂蜜 ${BEST.honey} 分</span>
          <span class="lh-chip">🐿️ 最佳 打松鼠 ${BEST.mole} 分</span>
          <span class="lh-chip">🃏 最少 ${BEST.match || '—'} 步配对</span>
        </div>
      </div>
      <div class="game-grid">
        ${GAMES.map(g => `
          <article class="game-card" style="--gc:${g.color}">
            <div class="gc-cover" style="background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.5),transparent 55%),linear-gradient(135deg,${g.color},#2f7d4f)">
              <span class="gc-icon">${g.icon}</span>
              ${BEST[g.id] ? `<span class="gc-best">最佳 ${BEST[g.id]}${g.unit}</span>` : ''}
            </div>
            <div class="gc-body">
              <h3>${g.name}</h3>
              <p>${g.desc}</p>
              <div class="gc-foot">
                <span class="gc-time">⏱ ${g.time}</span>
                <button class="gc-play" onclick="openGame('${g.id}')">▶ 开始游戏</button>
              </div>
            </div>
          </article>`).join('')}
      </div>
      <p class="lobby-tip">🐻 小提示：接蜂蜜可以用鼠标拖动，也能用键盘 ← → 控制小熊篮子。</p>
    </section>`;
}

/* ================= 游戏舞台 ================= */
function renderStage(){
  const g = GAMES.find(x => x.id === active);
  const hudTitle = active === 'match' ? '步数' : '得分';
  const hudTime  = active === 'match' ? '用时' : '剩余';
  let board = '';
  if (active === 'honey'){
    board = `<div class="board-wrap">
        <canvas id="honeyCanvas" class="honey-canvas"></canvas>
        <p class="stage-hint">拖动画布或按 ← → 移动小熊；接住蜂蜜罐 +10，碰到蜜蜂 −8。</p>
      </div>`;
  } else if (active === 'mole'){
    board = `<div class="board-wrap">
        <div class="mole-grid" id="moleGrid">
          ${Array.from({length:9}, (_, i) => `
            <button class="mole-hole" data-i="${i}">
              <span class="hole-grass"></span>
              <span class="mole-emoji">🐿️</span>
              <span class="hole-dirt"></span>
            </button>`).join('')}
        </div>
        <p class="stage-hint">小松鼠从树洞里探头时点它 +10 分，漏掉不扣分，手速要快～</p>
      </div>`;
  } else {
    board = `<div class="board-wrap">
        <div class="match-grid" id="matchGrid"></div>
        <p class="stage-hint">翻开两张相同的小动物即可配对，8 秒内看清位置哦～</p>
      </div>`;
  }
  app.innerHTML = `
    <header class="gp-nav">
      <button class="gp-back" onclick="exitToLobby()">← 返回大厅</button>
      <div class="gp-brand">🎮 森林小游戏中心</div>
      <div class="gp-record">最高分：${BEST.honey} / ${BEST.mole} / ${BEST.match} 步</div>
    </header>
    <section class="stage">
      <div class="stage-bar">
        <div class="stage-title">
          <span class="stage-icon">${g.icon}</span>
          <div><b>${g.name}</b><span class="stage-sub">${active === 'match' ? '翻出所有成对卡片' : '30 秒挑战'}</span></div>
        </div>
        <div class="stage-hud">
          <div class="hud-item"><span class="hud-k">${hudTitle}</span><span class="hud-v" id="hudScore">0</span></div>
          <div class="hud-item"><span class="hud-k">${hudTime}</span><span class="hud-v" id="hudTime">${active === 'match' ? '0s' : '30s'}</span></div>
          <div class="hud-item best"><span class="hud-k">最佳</span><span class="hud-v">${BEST[active] || '—'}${g.unit}</span></div>
        </div>
        <div class="stage-ops">
          <button class="btn ghost sm" onclick="exitToLobby()">返回大厅</button>
          <button class="btn primary sm" onclick="restart()">↻ 重玩</button>
        </div>
      </div>
      ${board}
    </section>`;
}

/* ================= 通用 ================= */
function goHome(){ stopAll(); screen='home'; active=''; renderHome(); }
function enterLobby(){ stopAll(); screen='lobby'; active=''; renderLobby(); }
function exitToLobby(){ stopAll(); active=''; screen='lobby'; renderLobby(); }

function openGame(id){
  stopAll();
  active = id; screen = 'game';
  renderStage();
  if (id === 'honey') startHoney();
  else if (id === 'mole') startMole();
  else startMatch();
}
function restart(){ openGame(active); }

function setHud(score, time){
  const s = document.getElementById('hudScore');
  const t = document.getElementById('hudTime');
  if (s && score !== null) s.textContent = score;
  if (t && time !== null) t.textContent = time;
}

function showResult(o){
  const stage = document.querySelector('.stage');
  if (!stage) return;
  if (stage.querySelector('.result-mask')) return;
  const div = document.createElement('div');
  div.className = 'result-mask';
  div.innerHTML = `<div class="result-card">
      <div class="result-emoji">${o.emoji}</div>
      <h3>${o.title}</h3>
      <p class="result-score">${o.score}</p>
      <p class="result-sub">${o.sub}</p>
      <div class="result-btns">
        <button class="btn ghost" onclick="exitToLobby()">返回大厅</button>
        <button class="btn primary" onclick="restart()">再玩一次</button>
      </div>
    </div>`;
  stage.appendChild(div);
}

function stopAll(){
  if (game && game.stop) game.stop();
  game = null;
}

/* ================= 接蜂蜜 ================= */
function startHoney(){
  const canvas = document.getElementById('honeyCanvas');
  if (!canvas) return;
  const st = {
    items: [], basketX: 0, pointerX: null, raf: 0, last: 0, spawnAcc: 0,
    left: 30, score: 0, running: true, W: 0, H: 0, ctx: null,
    keys: { left:false, right:false }, stop: null
  };
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  st.W = Math.max(280, Math.round(rect.width));
  st.H = Math.max(240, Math.round(rect.height));
  canvas.width = Math.round(st.W * dpr);
  canvas.height = Math.round(st.H * dpr);
  st.ctx = canvas.getContext('2d');
  st.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  st.basketX = st.W / 2;

  const onMove = (e) => {
    const r = canvas.getBoundingClientRect();
    st.pointerX = e.clientX - r.left;
  };
  const onKey = (e) => {
    if (!st.running) return;
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') st.keys.left = e.type === 'keydown';
    if (k === 'ArrowRight' || k === 'd' || k === 'D') st.keys.right = e.type === 'keydown';
    if (k === 'ArrowLeft' || k === 'ArrowRight') e.preventDefault();
  };
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerdown', onMove);
  window.addEventListener('keydown', onKey);
  window.addEventListener('keyup', onKey);

  const drawItem = (it) => {
    const c = st.ctx;
    c.save(); c.translate(it.x, it.y);
    if (it.bee){
      c.fillStyle = 'rgba(255,255,255,.85)';
      c.beginPath(); c.ellipse(-7,-9,7,5,-.6,0,Math.PI*2); c.fill();
      c.beginPath(); c.ellipse(7,-9,7,5,.6,0,Math.PI*2); c.fill();
      c.fillStyle = '#ffc93c'; c.beginPath(); c.arc(0,0,13,0,Math.PI*2); c.fill();
      c.strokeStyle = '#3a2e1f'; c.lineWidth = 3;
      for (let i = -1; i <= 1; i++){
        c.beginPath(); c.arc(0,0,13,-.55+i*.6,.15+i*.6); c.stroke();
      }
      c.fillStyle = '#3a2e1f';
      c.beginPath(); c.arc(-4,-4,1.8,0,Math.PI*2); c.arc(4,-4,1.8,0,Math.PI*2); c.fill();
      c.restore(); return;
    }
    c.fillStyle = '#ffb703';
    c.beginPath(); c.moveTo(-11,-4); c.lineTo(11,-4); c.lineTo(8,12);
    c.quadraticCurveTo(0,16,-8,12); c.closePath(); c.fill();
    c.fillStyle = '#f39c12'; c.fillRect(-12,-10,24,7);
    c.fillStyle = '#fff7e0'; c.beginPath(); c.arc(0,5,4,0,Math.PI*2); c.fill();
    c.restore();
  };

  const drawBasket = (x, y) => {
    const c = st.ctx;
    c.save(); c.translate(x, y);
    c.fillStyle = '#a9743c';
    c.beginPath(); c.arc(-26,-34,10,0,Math.PI*2); c.arc(26,-34,10,0,Math.PI*2); c.fill();
    c.fillStyle = '#c89b63'; c.beginPath(); c.arc(0,-30,25,0,Math.PI*2); c.fill();
    c.fillStyle = '#f0dcc0'; c.beginPath(); c.ellipse(0,-21,13,10,0,0,Math.PI*2); c.fill();
    c.fillStyle = '#3a2e1f';
    c.beginPath(); c.arc(-9,-35,3,0,Math.PI*2); c.arc(9,-35,3,0,Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(0,-24,3.6,2.8,0,0,Math.PI*2); c.fill();
    c.fillStyle = '#d8a24a';
    c.beginPath(); c.moveTo(-42,-8); c.lineTo(42,-8); c.lineTo(32,24);
    c.quadraticCurveTo(0,34,-32,24); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(160,110,50,.45)'; c.lineWidth = 2;
    for (let i = -3; i <= 3; i++){
      c.beginPath(); c.moveTo(i*11,-8); c.lineTo(i*8,26); c.stroke();
    }
    c.restore();
  };

  const draw = () => {
    const c = st.ctx;
    const bg = c.createLinearGradient(0,0,0,st.H);
    bg.addColorStop(0,'#eef9e2'); bg.addColorStop(.6,'#f8f3da'); bg.addColorStop(1,'#dcefc2');
    c.fillStyle = bg; c.fillRect(0,0,st.W,st.H);

    c.fillStyle = 'rgba(255,206,84,.55)';
    c.beginPath(); c.arc(st.W-52,46,28,0,Math.PI*2); c.fill();

    for (let x = -20; x < st.W + 40; x += 78){
      const th = 52 + ((x*7) % 23);
      c.fillStyle = 'rgba(120,180,110,.32)';
      c.beginPath(); c.moveTo(x, st.H-40); c.lineTo(x+30, st.H-40-th); c.lineTo(x+60, st.H-40);
      c.closePath(); c.fill();
    }
    c.fillStyle = '#bfe3a2';
    c.beginPath(); c.moveTo(0, st.H-40);
    c.quadraticCurveTo(st.W*.5, st.H-62, st.W, st.H-40);
    c.lineTo(st.W, st.H); c.lineTo(0, st.H); c.closePath(); c.fill();

    st.items.forEach(drawItem);
    drawBasket(st.basketX, st.H-42);
  };

  const loop = (ts) => {
    if (!st.running) return;
    if (!st.last) st.last = ts;
    const dt = Math.min((ts - st.last)/1000, .05);
    st.last = ts;

    st.left -= dt;
    setHud(st.score, Math.max(0, Math.ceil(st.left)) + 's');
    if (st.left <= 0){ endHoney(); return; }

    st.spawnAcc += dt;
    const gap = .62 - Math.min(.3, ((30 - st.left)/30) * .32);
    if (st.spawnAcc >= gap){
      st.spawnAcc = 0;
      st.items.push({
        x: 26 + Math.random()*(st.W-52), y: -20,
        vy: 120 + Math.random()*110, r: 14, bee: Math.random() < .28
      });
    }

    if (st.keys.left){ st.pointerX = null; st.basketX -= 340*dt; }
    if (st.keys.right){ st.pointerX = null; st.basketX += 340*dt; }
    if (st.pointerX !== null) st.basketX += (st.pointerX - st.basketX) * Math.min(1, dt*16);
    st.basketX = Math.max(46, Math.min(st.W-46, st.basketX));

    const catchY = st.H - 58;
    for (let i = st.items.length - 1; i >= 0; i--){
      const it = st.items[i];
      it.y += it.vy * dt;
      if (it.y + it.r >= catchY && it.y - it.r < catchY + 30 && Math.abs(it.x - st.basketX) < 46){
        st.score = Math.max(0, st.score + (it.bee ? -8 : 10));
        setHud(st.score, null);
        st.items.splice(i,1);
        continue;
      }
      if (it.y - it.r > st.H) st.items.splice(i,1);
    }
    draw();
    st.raf = requestAnimationFrame(loop);
  };

  const endHoney = () => {
    st.running = false;
    if (st.raf) cancelAnimationFrame(st.raf);
    window.removeEventListener('keydown', onKey);
    window.removeEventListener('keyup', onKey);
    canvas.removeEventListener('pointermove', onMove);
    canvas.removeEventListener('pointerdown', onMove);
    const isNew = st.score > BEST.honey;
    if (isNew){ BEST.honey = st.score; saveBest(); }
    showResult({
      emoji:'🍯', title:'时间到！', score:`${st.score} 分`,
      sub: isNew ? '🎉 新纪录！小熊篮子满载而归' : `历史最佳 ${BEST.honey} 分，再试一次？`
    });
  };

  st.stop = () => {
    st.running = false;
    if (st.raf) cancelAnimationFrame(st.raf);
    window.removeEventListener('keydown', onKey);
    window.removeEventListener('keyup', onKey);
    canvas.removeEventListener('pointermove', onMove);
    canvas.removeEventListener('pointerdown', onMove);
  };

  game = st;
  st.raf = requestAnimationFrame(loop);
}

/* ================= 打松鼠 ================= */
function startMole(){
  const grid = document.getElementById('moleGrid');
  if (!grid) return;
  const holes = Array.from(grid.querySelectorAll('.mole-hole'));
  const st = { score: 0, time: 30, timers: [], running: true, stop: null };

  holes.forEach((h) => {
    h.addEventListener('click', () => {
      if (!st.running || !h.classList.contains('up') || h.classList.contains('hit')) return;
      h.classList.add('hit');
      st.score += 10;
      setHud(st.score, null);
      const t = setTimeout(() => {
        h.classList.remove('up','hit');
      }, 240);
      st.timers.push(t);
    });
  });

  const tick = setInterval(() => {
    if (!st.running) return;
    st.time -= 1;
    setHud(null, Math.max(0, st.time) + 's');
    if (st.time <= 0) end();
  }, 1000);

  const loopSpawn = () => {
    if (!st.running) return;
    const free = holes.map((h,i) => (h.classList.contains('up') ? -1 : i)).filter(i => i >= 0);
    if (free.length){
      const h = holes[free[Math.floor(Math.random()*free.length)]];
      h.classList.add('up');
      h.classList.remove('hit');
      const t = setTimeout(() => { h.classList.remove('up','hit'); }, 760 + Math.random()*520);
      st.timers.push(t);
    }
    const t2 = setTimeout(loopSpawn, 520 + Math.random()*380);
    st.timers.push(t2);
  };
  loopSpawn();

  const end = () => {
    st.running = false;
    clearInterval(tick);
    st.timers.forEach(clearTimeout);
    holes.forEach(h => h.classList.remove('up','hit'));
    const isNew = st.score > BEST.mole;
    if (isNew){ BEST.mole = st.score; saveBest(); }
    showResult({
      emoji:'🐿️', title:'时间到！', score:`${st.score} 分`,
      sub: isNew ? '🎉 新纪录！松鼠都跑不过你' : `历史最佳 ${BEST.mole} 分，再来一局？`
    });
  };

  st.stop = () => { st.running = false; clearInterval(tick); st.timers.forEach(clearTimeout); };
  game = st;
}

/* ================= 森林翻牌 ================= */
function startMatch(){
  const grid = document.getElementById('matchGrid');
  if (!grid) return;
  const ICONS = ['🦌','🦉','🐻','🦊','🐰','🐿️'];
  const cards = ICONS.flatMap((icon,i) => [
    { uid:`${i}-a`, icon, flipped:false, matched:false },
    { uid:`${i}-b`, icon, flipped:false, matched:false }
  ]);
  for (let i = cards.length - 1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }

  const st = { moves:0, seconds:0, found:0, lock:false, open:[], running:true, timers:[], stop:null };

  grid.innerHTML = cards.map((c,i) => `
    <button class="mcard" data-i="${i}">
      <span class="mcard-inner">
        <span class="mcard-face mcard-back">🌲</span>
        <span class="mcard-face mcard-front">${c.icon}</span>
      </span>
    </button>`).join('');

  const els = Array.from(grid.querySelectorAll('.mcard'));
  els.forEach((el) => {
    el.addEventListener('click', () => {
      const c = cards[+el.dataset.i];
      if (!st.running || st.lock || c.matched || c.flipped) return;
      c.flipped = true;
      el.classList.add('flip');
      st.open.push({ c, el });
      if (st.open.length < 2) return;

      st.moves += 1;
      setHud(st.moves, null);
      const [a, b] = st.open;
      st.open = [];
      if (a.c.icon === b.c.icon){
        a.c.matched = b.c.matched = true;
        a.el.classList.add('done'); b.el.classList.add('done');
        st.found += 1;
        if (st.found === ICONS.length) finish();
        return;
      }
      st.lock = true;
      const t = setTimeout(() => {
        a.c.flipped = b.c.flipped = false;
        a.el.classList.remove('flip'); b.el.classList.remove('flip');
        st.lock = false;
      }, 720);
      st.timers.push(t);
    });
  });

  const timer = setInterval(() => {
    if (!st.running) return;
    st.seconds += 1;
    setHud(null, st.seconds + 's');
  }, 1000);

  const finish = () => {
    clearInterval(timer);
    const isNew = !BEST.match || st.moves < BEST.match;
    if (isNew){ BEST.match = st.moves; saveBest(); }
    const t = setTimeout(() => {
      showResult({
        emoji:'🃏', title:'全部配对完成！', score:`${st.moves} 步`,
        sub: isNew ? `🎉 新纪录！用时 ${st.seconds} 秒` : `历史最佳 ${BEST.match} 步，用时 ${st.seconds} 秒`
      });
    }, 420);
    st.timers.push(t);
  };

  st.stop = () => { st.running = false; clearInterval(timer); st.timers.forEach(clearTimeout); };
  game = st;
}

/* ================= 启动 ================= */
renderHome();
</script>
